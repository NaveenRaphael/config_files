theme = "bogster"

[editor]
line-number = "relative"
soft-wrap.enable = true
bufferline ="multiple"
color-modes = true
true-color = true
completion-replace =true
end-of-line-diagnostics = "hint"
# path-completion = true
completion-timeout = 250
auto-completion = true
word-completion.enable = true
word-completion.trigger-length = 5
rainbow-brackets = true

[editor.lsp]
enable = true
display-messages = true
display-inlay-hints = true


[editor.cursor-shape]
insert = "bar"
normal = "block"

[editor.file-picker]
hidden= false
[editor.inline-diagnostics]
cursor-line = "warning"

[keys.normal]
"X" = "extend_line_above"

"A-h" ="extend_char_left"
"A-l" ="extend_char_right"

"B" = "extend_prev_long_word_start"
"b" = "extend_prev_word_start"
"C-b" = "extend_prev_word_start"

"E" = "extend_next_long_word_end"
"e" = "extend_next_word_end"
"C-e" = "extend_next_sub_word_end"

"W" = "extend_next_long_word_start"
"w" = "extend_next_word_start"
"C-w" = "extend_next_sub_word_start"

"C-right" = "move_next_word_end"
"C-left" = "move_prev_word_start"
"g" = {"[" = "match_brackets"}
"r" = "replace_with_yanked"
"R" = "replace"

[keys.select]
";" = "command_mode"
":" = "collapse_selection"

[keys.normal.space]
"c" = ":config-open"
"q" = ":buffer-close"
"Q" = ":buffer-close!"
"C-c" = ":config-reload"
"n" = ":new"

[keys.insert]
"C-backspace" = 'delete_word_backward'
"C-right" = ["move_next_word_end", "collapse_selection"] 
"C-left" = ["move_prev_word_start", "collapse_selection"] 
